# AI 知识库自动化 Pipeline
# 安装: crontab crontab.conf

# 每天早上 8:00 运行 Step 1-2（免费采集）
0 8 * * * cd ~/v2-automation && python pipeline/pipeline.py --step 1 --step 2 >> logs/collect.log 2>&1

# 每周日上午 10:00 运行 Step 3-4（AI 分析入库）
0 10 * * 0 cd ~/v2-automation && python pipeline/pipeline.py --step 3 --step 4 >> logs/analyze.log 2>&1
