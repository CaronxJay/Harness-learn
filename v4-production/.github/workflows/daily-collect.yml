name: Daily AI Knowledge Collection

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and analyze
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/pipeline.py --sources github,rss --limit 20 --verbose

      - name: Validate JSON articles
        run: |
          if ls knowledge/articles/*.json 1>/dev/null 2>&1; then
            python hooks/validate_json.py knowledge/articles/*.json
          else
            echo "No articles to validate"
          fi
        continue-on-error: true

      - name: Check article quality
        run: |
          if ls knowledge/articles/*.json 1>/dev/null 2>&1; then
            python hooks/check_quality.py knowledge/articles/*.json
          else
            echo "No articles to check"
          fi
        continue-on-error: true

      - name: Commit and push
        run: |
          CHANGES=$(git status --porcelain -- knowledge/)
          if [ -z "$CHANGES" ]; then
            echo "No new data to commit"
            exit 0
          fi
          DATE=$(date +%Y-%m-%d)
          COUNT=$(echo "$CHANGES" | grep -c '\.json$' || true)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge/
          git commit -m "collect: ${COUNT} articles on ${DATE}"
          git push
